<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>回译</title>
<script>try{var t=localStorage.getItem('huiyi-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#1a1a1a;--mute:#555;--line:#999;--link:#337b83;--on:#fff;--accent:#28b3c3;--bad:#c62f2f;color-scheme:light}
:root[data-theme="dark"]{--bg:#191919;--card:#242424;--ink:#ededed;--mute:#b3b3b3;--line:#6b6b6b;--link:#5cc8d4;--on:#191919;--bad:#f08080;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--card:#242424;--ink:#ededed;--mute:#b3b3b3;--line:#6b6b6b;--link:#5cc8d4;--on:#191919;--bad:#f08080;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
main{width:100%;max-width:340px;background:var(--card);border-top:4px solid var(--accent);padding:28px 24px}
h1{margin:0 0 18px;font:700 24px/1.3 "Noto Serif SC","Songti SC","SimSun",serif}
label{display:block}
.f{font-size:14px;color:var(--mute)}
input[type=password]{display:block;width:100%;margin-top:6px;padding:10px 12px;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px}
input[type=password]:focus{outline:2px solid var(--link);outline-offset:1px}
.r{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:14px;color:var(--mute)}
button{width:100%;padding:10px;font:inherit;color:var(--on);background:var(--link);border:0;border-radius:2px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#m{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--bad)}
#m.p{color:var(--mute)}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>回译</h1>
  <form id="f" hidden>
    <label class="f">密码<input id="p" type="password" autocomplete="current-password" required autofocus></label>
    <label class="r"><input id="k" type="checkbox" checked>在这台设备上记住</label>
    <button id="b">打开</button>
  </form>
  <p id="m" class="p" role="status">正在打开…</p>
</main>
<script>
(async () => {
  const ITER = 600000, $ = id => document.getElementById(id), msg = (t, plain) => { $('m').textContent = t; $('m').className = plain ? 'p' : ''; };
  const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  const gate = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open('huiyi-gate', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const db = r.result, tx = db.transaction('k', mode), q = fn(tx.objectStore('k'));
      tx.oncomplete = () => { db.close(); res(q.result); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    };
  });
  const derive = async (pw, salt) => crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER },
    await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']),
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let bin;
  try {
    const r = await fetch('app.bin', { cache: 'no-cache' });
    if (!r.ok) throw 0;
    bin = new Uint8Array(await r.arrayBuffer());
  } catch (e) { return msg('打不开：检查网络后刷新这一页'); }
  const salt = bin.slice(0, 16), iv = bin.slice(16, 28), ct = bin.slice(28), saltId = hex(salt);
  const unlock = async key => {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  };
  const boot = html => { document.open(); document.write(html); document.close(); };
  try {
    const saved = await gate('readonly', s => s.get('key'));
    if (saved && saved.salt === saltId) return boot(await unlock(saved.key));
  } catch (e) {}
  msg('', true);
  $('f').hidden = false;
  $('p').focus();
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('b').disabled = true;
    msg('正在打开…', true);
    let html, key;
    try { key = await derive($('p').value, salt); html = await unlock(key); }
    catch (err) { $('b').disabled = false; $('p').select(); return msg('密码不对'); }
    try {
      if ($('k').checked) await gate('readwrite', s => s.put({ salt: saltId, key }, 'key'));
      else await gate('readwrite', s => s.delete('key'));
    } catch (err) {}
    boot(html);
  });
})();
</script>
</body>
</html>
